# Render Blueprint Specification for Smart Artisan Planner
services:
  - type: web
    name: smart-artisan-planner
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: mongo_url
        sync: false
        placeholder: "Your MongoDB connection URL (e.g. mongodb+srv://...)"
      - key: JWT_SECRET
        sync: false
        placeholder: "A secure JWT secret key"
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Google Gemini API key (for pricing and artisan analytics)"
      - key: GROQ_API_KEY
        sync: false
        placeholder: "Groq API key (for chat assistant)"
